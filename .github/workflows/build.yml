      - name: Compile iOS dylib (Pure Clang, NO Theos)
        run: |
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          OUTPUT_DYLIB=GameTweak.dylib

          # find输出存入数组，不用字符串变量
          mapfile -t SRC_FILES < <(find src -type f \( -name "*.m" -o -name "*.c" \))
          echo "将要编译的源码列表:"
          printf "%s\n" "${SRC_FILES[@]}"

          xcrun clang \
            -target arm64-apple-ios15.0 \
            -isysroot "$SDK_PATH" \
            -I src/fishhook \
            -dynamiclib \
            -fobjc-arc \
            -framework UIKit \
            -framework Foundation \
            -framework CoreGraphics \
            -o "$OUTPUT_DYLIB" \
            "${SRC_FILES[@]}"
