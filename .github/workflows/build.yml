name: Build GameTweak
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  THEOS: ${{ github.workspace }}/theos

jobs:
  build:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: brew install ldid xz

      - name: Clone Theos
        run: git clone --recursive --depth 1 https://github.com/theos/theos.git $THEOS

      - name: Download SDKs
        run: |
          set -e
          curl -L -o /tmp/sdks.tar.gz https://github.com/theos/sdks/archive/master.tar.gz
          tar -xzf /tmp/sdks.tar.gz -C /tmp
          mkdir -p $THEOS/sdks
          for sdk in /tmp/sdks-master/iPhoneOS*.sdk; do
            [ -d "$sdk" ] && ditto "$sdk" "$THEOS/sdks/$(basename $sdk)"
          done
          ls $THEOS/sdks/

      - name: Build
        run: |
          set -o pipefail
          export THEOS=$THEOS
          make clean
          make 2>&1 | tee build_log.txt

      - name: Package deb
        run: |
          set -o pipefail
          export THEOS=$THEOS
          make package FINALPACKAGE=1 2>&1 | tee -a build_log.txt

      - name: Upload dylib artifact
        uses: actions/upload-artifact@v5
        with:
          name: GameTweak-binary
          path: |
            .theos/obj/debug/*.dylib
          if-no-files-found: error

      - name: Upload deb artifact
        uses: actions/upload-artifact@v5
        with:
          name: GameTweak-deb
          path: packages/*.deb

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: build-log
          path: build_log.txt
