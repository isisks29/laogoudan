name: Build GameTweak‑Clang
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Compile iOS dylib
        run: |
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          OUTPUT_DYLIB=GameTweak.dylib

          xcrun clang \
            -target arm64-apple-ios15.0 \
            -isysroot "$SDK_PATH" \
            -dynamiclib \
            -fobjc-arc \
            -fvisibility=hidden \
            -framework UIKit \
            -framework Foundation \
            -framework CoreGraphics \
            -o "$OUTPUT_DYLIB" \
            src/*.m \
            src/UI/*.m \
            src/fishhook/*.c

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: GameTweak-binary
          path: GameTweak.dylib
